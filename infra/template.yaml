AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AWS SAM Template for Event-Driven Serverless AI Image Analyzer
  Pipeline: S3 ObjectCreated -> Lambda -> Amazon Rekognition -> DynamoDB

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Architecture: x86_64

Resources:
  # S3 Bucket for Input Image Storage
  SourceImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "image-analyzer-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/
            Function: !GetAtt ImageAnalyzerFunction.Arn

  # DynamoDB Table for Tag Persistence
  ImageTagsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ImageTags
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ImageKey
          AttributeType: S
      KeySchema:
        - AttributeName: ImageKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # AWS Lambda Orchestration Function
  ImageAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ImageAnalyzerFunction
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref ImageTagsTable
          MIN_CONFIDENCE: "70.0"
          MAX_LABELS: "10"
      Policies:
        - Statement:
            - Sid: ReadS3UploadedImage
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::image-analyzer-${AWS::AccountId}-${AWS::Region}/incoming/*"
            - Sid: InvokeRekognitionDetectLabels
              Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: "*"
            - Sid: WriteDynamoDBImageTags
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt ImageTagsTable.Arn

  # S3 Invocation Permission for Lambda
  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ImageAnalyzerFunction
      Principal: s3.amazonaws.com
      SourceArn: !GetAtt SourceImageBucket.Arn

Outputs:
  S3BucketName:
    Description: "Name of the S3 bucket created for uploading images"
    Value: !Ref SourceImageBucket
  DynamoDBTableName:
    Description: "DynamoDB table for storing AI image metadata"
    Value: !Ref ImageTagsTable
  LambdaFunctionArn:
    Description: "ARN of the serverless orchestrator Lambda function"
    Value: !GetAtt ImageAnalyzerFunction.Arn
